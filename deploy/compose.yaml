# Local stack: MariaDB + PrestaShop (image built from ../shop) + nginx HTTPS proxy.
# Start from the repo root: docker compose -f deploy/compose.yaml up -d --build
# Only the proxy publishes ports: HTTP_PORT redirects (301) to HTTPS_PORT.
name: ciocia

services:
  db:
    image: mariadb:10.11.18
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  shop:
    build: ../shop
    # Without SHOP_IMAGE: built locally (--build) and tagged ciocia-shop:local. With it, for
    # example the image CI published to GHCR, run with --no-build to use that image instead.
    image: ${SHOP_IMAGE:-ciocia-shop:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # No published ports: the shop is reachable only through the proxy (HTTPS)
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: "localhost:${HTTPS_PORT:?set HTTPS_PORT in deploy/.env (see .env.example)}"
      PS_ENABLE_SSL: 1
      PS_LANGUAGE: pl
      # Lowercase: the installer loads localization/<country>.xml (PLN, Polish VAT), and the
      # file name is case-sensitive. "PL" silently falls back to default.xml (EUR, USD, no VAT).
      PS_COUNTRY: pl
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_FOLDER_INSTALL: install-dev
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
    volumes:
      - shop-data:/var/www/html
    # Healthy once Apache answers. The image starts Apache only after the install and our
    # post-install scripts, so this means the shop is ready. Plain HTTP here gets PrestaShop's
    # 302 to HTTPS, and curl -f fails only on 4xx/5xx. Failures during start_period (the first
    # install) do not count. `docker compose ps` shows the status, and `up --wait` waits for it.
    # Every check is a line in the shop's access log: every 5 s while starting, then every 30 s.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 5s

  # Catches every e-mail the shop sends (SMTP mailpit:1025, inside the Compose network only).
  # Read them at http://localhost:8025 (MAILPIT_PORT); the port is bound to this machine only.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  proxy:
    build: ./proxy
    # Same as SHOP_IMAGE above
    image: ${PROXY_IMAGE:-ciocia-proxy:local}
    restart: unless-stopped
    depends_on:
      shop:
        condition: service_started
        # nginx resolves shop's IP once at start. A targeted `up -d shop` does not restart
        # the proxy; run `docker compose restart proxy` after it.
        restart: true
    ports:
      - "${HTTP_PORT:?set HTTP_PORT in deploy/.env (see .env.example)}:80"
      - "${HTTPS_PORT:?set HTTPS_PORT in deploy/.env (see .env.example)}:443"
    environment:
      # Used in the HTTP -> HTTPS redirect (nginx $host has no port)
      HTTPS_PORT: "${HTTPS_PORT:?set HTTPS_PORT in deploy/.env (see .env.example)}"
    volumes:
      # Self-signed cert and key, generated on first start, kept until `down -v`
      - certs:/etc/nginx/certs

volumes:
  db-data:
  shop-data:
  certs:
