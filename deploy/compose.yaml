# Local stack: MariaDB + PrestaShop (image built from ../shop).
# Start from the repo root: docker compose -f deploy/compose.yaml up -d --build
name: ciocia

services:
  db:
    image: mariadb:10.11.18
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  shop:
    build: ../shop
    image: ciocia-shop:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SHOP_PORT}:80"
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:${SHOP_PORT}
      PS_LANGUAGE: pl
      PS_COUNTRY: PL
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_FOLDER_INSTALL: install-dev
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
    volumes:
      - shop-data:/var/www/html

volumes:
  db-data:
  shop-data:
