name: Init timing

# A timed clean start, the way the README does it: copy .env.example, start the shop, run the data init.
# Measures the 15 minute limit from a clean clone (issue #71) on a GitHub runner. Manual only (Actions >
# Init timing > Run workflow): the full run downloads the 585 MB image archive and imports every product,
# which takes far longer than a PR check should. The times are in the run's summary page.
on:
  workflow_dispatch:
    inputs:
      subset:
        description: "Only the subset (init --subset) instead of all products"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Configure as in the README
        run: cp deploy/.env.example deploy/.env
      - name: Start the shop
        shell: bash
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          docker compose -f deploy/compose.yaml up -d --build
          echo "UP_DONE=$(date +%s)" >> "$GITHUB_ENV"
      # Right after `up -d`, as in the README: init downloads the images while the shop installs.
      # The input goes through an environment variable, not straight into the script.
      - name: Data init
        shell: bash
        env:
          SUBSET: ${{ inputs.subset }}
        run: |
          if [ "$SUBSET" = "true" ]; then set -- --subset; fi
          docker compose -f deploy/compose.yaml --profile init run --rm --build init "$@" 2>&1 | tee "$RUNNER_TEMP/init.txt"
          echo "INIT_DONE=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check the shop
        run: sh .github/scripts/smoke-test.sh
      - name: Times
        if: always()
        shell: bash
        env:
          SUBSET: ${{ inputs.subset }}
        run: |
          seconds() { if [ -n "$2" ]; then echo "$(( $2 - $1 )) s"; else echo "did not finish"; fi; }
          {
            echo "## Init timing ($([ "$SUBSET" = "true" ] && echo subset || echo all products), $(nproc) CPUs)"
            echo
            echo "| Step | Time |"
            echo "|---|---|"
            echo "| \`up -d --build\` (build and start the containers) | $(seconds "$STARTED" "${UP_DONE:-}") |"
            echo "| \`init\` (images, waiting for the install, import) | $(seconds "${UP_DONE:-0}" "${INIT_DONE:-}") |"
            echo "| **Clean clone to a shop with data** | **$(seconds "$STARTED" "${INIT_DONE:-}")** |"
            echo
            echo "Init's output, without the download progress (the import's own times are at the end):"
            echo
            echo '```'
            grep -v "% of" "$RUNNER_TEMP/init.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container status and logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml ps -a
          docker compose -f deploy/compose.yaml logs --no-color
          cat deploy/logs/importer.log || true
