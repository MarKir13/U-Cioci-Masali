name: Secret scan

# The lecturer's view of the repository: every branch, full history (W1).
# PRs only check main plus their own commits, so a branch nobody has opened a PR for
# shows up here first. Not a required check; a red run means a branch needs cleaning.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-branches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history of every branch and tag
          fetch-depth: 0
      - name: Secret scan (every branch)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --ignore-gitleaks-allow --log-opts="--all"
      - name: Repository limits (every branch)
        if: ${{ !cancelled() }}
        run: sh .github/scripts/check-repo-limits.sh --all
