name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt
      - name: Unit tests
        working-directory: scraper
        run: python -m pytest

  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: secrets and large files count in every commit, not only the last one
          fetch-depth: 0
      # On a PR, HEAD is GitHub's test merge of the PR into main, so this covers the whole
      # history of main plus every commit of the PR. Default rules, no allowlist (W1):
      # --ignore-gitleaks-allow also reports lines marked with a `gitleaks:allow` comment, and the
      # limits script fails on a committed .gitleaks.toml or .gitleaksignore.
      - name: Secret scan (main and this PR)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --ignore-gitleaks-allow --log-opts="--all"
      - name: Repository limits
        if: ${{ !cancelled() }}
        run: sh .github/scripts/check-repo-limits.sh

  ci-gate:
    if: always()
    needs: [scraper, repo-hygiene]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job did not succeed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
