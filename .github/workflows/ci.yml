name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt
      - name: Unit tests
        working-directory: scraper
        run: python -m pytest
      # The importer (deploy/importer) is Python too: ruff above already covers it. Its tests need no shop,
      # only the files in scraper-results/. Same job, so the required check `scraper` keeps its name.
      - name: Install importer dependencies
        if: ${{ !cancelled() }}
        run: pip install -r deploy/importer/requirements.txt
      - name: Importer unit tests
        if: ${{ !cancelled() }}
        working-directory: deploy/importer
        run: python -m pytest

  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: secrets and large files count in every commit, not only the last one
          fetch-depth: 0
      # On a PR, HEAD is GitHub's test merge of the PR into main, so this covers the whole
      # history of main plus every commit of the PR. Default rules, no allowlist (W1):
      # --ignore-gitleaks-allow also reports lines marked with a `gitleaks:allow` comment, and the
      # limits script fails on a committed .gitleaks.toml or .gitleaksignore.
      - name: Secret scan (main and this PR)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --ignore-gitleaks-allow --log-opts="HEAD"
      - name: Repository limits
        if: ${{ !cancelled() }}
        run: sh .github/scripts/check-repo-limits.sh

  # Container, shell, JavaScript and PHP files. Every step runs even if an earlier one failed,
  # so one run shows all problems. Linters run from pinned Docker images, nothing is installed.
  infra-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dockerfiles (hadolint)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.15.1 hadolint shop/Dockerfile deploy/proxy/Dockerfile deploy/importer/Dockerfile scraper/Dockerfile
      - name: Shell scripts (shellcheck)
        if: ${{ !cancelled() }}
        # -z and xargs -0 pass each path as one argument, even with spaces in it
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo koalaman/shellcheck:v0.11.0
      # --quiet prints nothing for a valid file. An unknown variable is only a warning (Compose
      # replaces it with an empty string), so any output, warning or error, fails the step.
      - name: Compose file
        if: ${{ !cancelled() }}
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml config --quiet 2>&1 | tee "$RUNNER_TEMP/compose-output.txt"
          test ! -s "$RUNNER_TEMP/compose-output.txt"
      # PHP 8.1 checks one file per `php -l`, so xargs -n1 starts one container per file. php exits
      # with 255 on a syntax error, which makes xargs stop at the first broken file and fail the step.
      # Covers every PHP file under shop/ (modules, setup scripts, settings); git's '*' also matches '/'.
      - name: PHP syntax (php -l)
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git ls-files 'shop/*.php')" ]; then
            echo "No PHP files in shop/"
            exit 0
          fi
          git ls-files -z 'shop/*.php' |
            xargs -0 -n1 docker run --rm -v "$PWD:/repo:ro" -w /repo php:8.1.34-cli php -l
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: "24"
      - name: Install ESLint (versions from package-lock.json)
        if: ${{ !cancelled() }}
        run: npm ci
      - name: JavaScript (ESLint)
        if: ${{ !cancelled() }}
        run: npx eslint

  # Decides whether `smoke` runs: only when the change touches what the shop is built and started
  # from, or the E2E tests that run in it. HEAD^1 is main: on a PR, HEAD is GitHub's test merge of the
  # PR into main; on a push to main, HEAD is the PR's merge commit. So the diff lists every file the PR
  # changes.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      shop: ${{ steps.diff.outputs.shop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # scraper-results/: the data the smoke job's init imports. tests/ and e2e-runs.sh: the E2E run at its end
      - name: Did shop/, deploy/, scraper-results/, tests/ or the smoke or E2E scripts change?
        id: diff
        run: |
          git diff --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/changed-files.txt"
          if grep -qE '^(shop/|deploy/|scraper-results/|tests/|\.github/workflows/ci\.yml|\.github/scripts/(smoke-test|e2e-runs)\.sh)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "shop=true" >> "$GITHUB_OUTPUT"
          else
            echo "shop=false" >> "$GITHUB_OUTPUT"
          fi

  # A clean install, the way the lecturer starts the shop from the README: build, install, wait
  # until every container is ready, then check the shop through the HTTPS proxy. Then the subset data
  # and one run of the E2E suite on it, so a PR that breaks the purchase scenario fails `ci-gate`.
  # The 3 runs in a row for W4 stability are in e2e.yml (main, nightly, by hand).
  smoke:
    needs: changes
    if: needs.changes.outputs.shop == 'true'
    runs-on: ubuntu-24.04
    # Install up to 10 minutes, two subset inits of about 2 minutes together, then Node.js, Chromium and
    # one E2E run of up to 5 minutes
    timeout-minutes: 30
    env:
      # Ports from deploy/.env.example
      BASE_URL: https://localhost:8443
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - name: Configure as in the README
        run: cp deploy/.env.example deploy/.env
      # --wait: until db and shop are healthy (their healthchecks) and the others are running.
      # Fails if a container stops or turns unhealthy, or after 600 s.
      - name: Build, install and wait until ready
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 600
      - name: Check the running shop
        run: sh .github/scripts/smoke-test.sh
      # The data init command from the README (issue #71) with the small subset: the images of categories 85 and 99
      # from the GitHub Release, then their import. GitHub sets CI=true, so init never points to the source shop.
      - name: Data init (subset)
        run: docker compose -f deploy/compose.yaml --profile init run --rm --build init --subset
      # A second init must change nothing: no download, nothing created or deleted, so no duplicates.
      # The summary has one row per resource: its name, then 5 whole numbers (created, updated, unchanged, deleted,
      # rejected). No other line of the output has that shape, so new resources are checked without listing them.
      # shell: bash runs with pipefail, so a failed init still fails the step behind `| tee`.
      - name: Second data init changes nothing
        shell: bash
        run: |
          docker compose -f deploy/compose.yaml --profile init run --rm init --subset 2>&1 | tee "$RUNNER_TEMP/second-init.txt"
          grep -q "nothing to download" "$RUNNER_TEMP/second-init.txt"
          awk 'NF == 6 && $2 $3 $4 $5 $6 ~ /^[0-9]+$/ && ($2 > 0 || $5 > 0) {
                 print "changed on the second run: " $0; changed = 1
               } END { exit changed }' "$RUNNER_TEMP/second-init.txt"
      - name: Check the shop again, with data
        run: sh .github/scripts/smoke-test.sh
      # The same E2E steps as in e2e.yml, with one run: enough to catch a change that breaks the scenario
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Keeps npm's download cache between runs, keyed on the lock file
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the test dependencies (versions from tests/package-lock.json)
        working-directory: tests
        run: npm ci
      # --with-deps: also the system libraries Chromium needs on a Linux machine without a desktop
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: E2E run
        run: sh .github/scripts/e2e-runs.sh 1
      # Also after a failed run, since then the report matters most. Download it from the run's summary page.
      - name: Upload the E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # The summary that e2e-runs.sh writes names this artifact: change both together
          name: e2e-reports
          path: tests/e2e-runs/
          retention-days: 14
      - name: Container status and logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml ps -a
          docker compose -f deploy/compose.yaml logs --no-color
          # Every rejection and API error of the import (deploy/logs is gitignored)
          cat deploy/logs/importer.log || true
      - name: Remove containers and volumes
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  ci-gate:
    if: always()
    needs: [scraper, repo-hygiene, infra-lint, changes, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job did not succeed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
