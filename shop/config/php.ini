; PHP overrides for PrestaShop. Loaded last (zz- prefix), so these win over image defaults.

; Resources: admin pages and product import need more than the PHP defaults
memory_limit = 512M
max_execution_time = 300
max_input_vars = 10000

; Uploads: product images and module zips from the admin panel
upload_max_filesize = 32M
post_max_size = 32M

; Polish shop: dates in orders, invoices and logs use local time
date.timezone = Europe/Warsaw

; Stack traces of fatal errors go to the container log. With arguments in them, a crash inside the
; Webservice API wrote the first 15 characters of the API key there (WebserviceRequest->fetch('KEY...')).
; This leaves arguments out, as PHP recommends for production.
zend.exception_ignore_args = On

; Performance: cache compiled PHP
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
