# The Webservice API key is sent as the HTTP Basic auth user name (shop/scripts/setup/webservice.php),
# and Apache's standard log formats write that user (%u) into every access log line, which goes to
# `docker compose logs shop`. These are the same formats from apache2.conf with "-" instead of %u, so the
# key never reaches a log. Loaded after apache2.conf, and the last definition of a name wins.
LogFormat "%v:%p %h %l - %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l - %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l - %t \"%r\" %>s %O" common
