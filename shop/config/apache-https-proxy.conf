# The shop sits behind the nginx proxy (deploy/proxy), which ends TLS and talks to Apache over
# plain HTTP. The proxy always sets X-Forwarded-Proto: https, and this turns it into HTTPS=on,
# so PHP ($_SERVER['HTTPS']) and PrestaShop know the request was secure. Without it PrestaShop
# (SSL enabled everywhere) redirects to HTTPS again and loops forever.
# The shop port is not published, so only the proxy can reach Apache and set this header.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
